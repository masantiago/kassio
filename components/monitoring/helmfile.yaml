bases:  
  - ../bases/repos.yaml
  - ../bases/environments.yaml

{{ readFile "../bases/templates.yaml" }}

commonLabels:
  component: monitoring

releases:

  - name: kassio-metrics
    <<: *release
    chart: prometheus/kube-prometheus-stack
    version: 59.1.0
    labels:
      element: metrics
    timeout: 600

  - name: kassio-logs
    <<: *release
    chart: grafana/loki-stack
    version: 2.10.2
    labels:
      element: logs