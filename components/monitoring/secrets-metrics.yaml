---
grafana:
  adminPassword: ref+vault://kassio/monitoring/#password
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://kassio-logs-loki:3100
    - name: Influxdb
      type: influxdb
      url: http://kassio-db-metrics:8086
      jsonData:
        version: Flux
        organization: kassio
        defaultBucket: kassio-db
      secureJsonData:
        token: ref+vault://kassio/db/metrics/#password
